name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.2
          target: esp32
          path: firmware

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware/build/esp32-secure-ota.bin

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.2
          target: esp32
          path: firmware
          command: idf.py -DPROJECT_VER=${{ env.VERSION }} build

      - name: Sign firmware
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
          OTA_BASE_URL: ${{ vars.OTA_BASE_URL }}
        run: |
          mkdir -p keys
          printf '%s\n' "$OTA_SIGNING_KEY" > keys/ota_signing_key.pem
          tools/sign_firmware.sh firmware/build/esp32-secure-ota.bin "$VERSION" "$OTA_BASE_URL"

      - uses: actions/upload-artifact@v4
        with:
          name: signed-firmware
          path: |
            server/firmware/firmware-*.bin
            server/firmware/firmware-*.bin.sig
            server/firmware/manifest.json
